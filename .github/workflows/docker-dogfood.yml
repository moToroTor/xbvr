name: dogfood-image

# Builds a test image of fork master (all local fixes) and pushes it to
# GHCR on every master push or on demand. Pull on the NAS with:
#   docker pull ghcr.io/motorotor/xbvr:dogfood

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn

      - name: Build UI
        run: yarn install --frozen-lockfile && yarn build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build binary
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o xbvr .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/motorotor/xbvr:dogfood
            ghcr.io/motorotor/xbvr:dogfood-${{ github.sha }}
